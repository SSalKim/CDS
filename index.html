<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수치일기도표출시스템</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3Cpath d='M3 4h10v2H3zM3 7h7v2H3zM3 10h10v2H3z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3.3-exp14">
</head>
<body>
<div class="app-shell">
<aside class="sidebar">

<div class="logo-block" id="appTitleReset" role="button" tabindex="0">
<span class="title">수치일기도<br>표출시스템</span>
<div class="subtitle">Chart Display System 3.3</div>
</div>

<nav class="main-menu" id="mainMenu">
<button class="menu-btn" data-menu="edit">편집일기도</button>
<button class="menu-btn" data-menu="analysis">분석장</button>
<button class="menu-btn active" data-menu="forecast">예보장</button>
<button class="menu-btn" data-menu="hazard">위험기상</button>
<button class="menu-btn" data-menu="ensemble">앙상블</button>
</nav>

<div class="model-box">
<div id="modelGrid" class="model-grid"></div>
</div>

</aside>

<main class="main-panel">

<div class="toolbar">

<div class="toolbar-left">

<button id="nowBtn">NOW</button>

<div class="main-datetime-group">
<input
id="runDate"
type="date"
min="1900-01-01"
max="2099-12-31"
>

<select id="runHour"></select>
</div>

<div class="time-toggle-stack">
<button id="kstBtn" class="time-mode active" type="button">KST</button>
<button id="utcBtn" class="time-mode" type="button">UTC</button>
</div>

<div id="runShiftGroup" class="run-shift-group" aria-label="자료시각 이동">
  <button type="button" data-shift-hours="-24">-24H</button>
  <button type="button" data-shift-hours="-12">-12H</button>
  <button type="button" data-shift-hours="-6">-6H</button>
  <button type="button" data-shift-hours="6">+6H</button>
  <button type="button" data-shift-hours="12">+12H</button>
  <button type="button" data-shift-hours="24">+24H</button>
</div>

<select id="productCategory"></select>
<select id="productSelect"></select>

<div id="timelineTopControls" class="timeline-top-controls"></div>

</div>

</div>

<div class="forecast-bar">
  <div class="forecast-shell">
    <input id="forecastSlider" class="native-forecast-slider" type="range" min="0" max="0" step="1" value="0">
    <div id="forecastTimeline" class="forecast-timeline" aria-label="forecast timeline"></div>
    <div id="forecastLabel" class="forecast-label-hidden">+000h</div>
  </div>
</div>

<div class="viewer-layout">

  <div class="viewer-wrap">

    <div id="modelStatus" class="viewer-message hidden"></div>

    <div id="chartImages" class="chart-images"></div>

    <div id="loadingOverlay" class="loading hidden">
      <div class="spinner"></div>
      <div class="loading-text">이미지 로딩 중</div>
    </div>

  </div>

  <aside id="auxSidebar" class="aux-sidebar hidden">
    <div class="aux-sidebar-inner">
      <div id="auxSidebarTitle" class="aux-sidebar-title"></div>
      <div id="auxSidebarList" class="aux-sidebar-list"></div>
    </div>
  </aside>

</div>

</main>

</div>

<script src="models.js"></script>
<script src="edit.js"></script>
<script src="analysis.js"></script>
<script src="products.js"></script>
<script src="hazards.js"></script>
<script src="ensemble.js"></script>

<script src="catalog-config.js"></script>
<script src="aux-data.js"></script>
<script src="aux-rules.js"></script>

<script src="chart-utils.js?v=3.3-exp2"></script>
<script src="timeline-state.js"></script>
<script src="image-pipeline.js"></script>
<script src="time-controls.js"></script>
<script src="catalog-core.js"></script>
<script src="model-menu.js?v=3.3-exp2"></script>
<script src="product-menu.js"></script>
<script src="main-menu.js"></script>
<script src="aux-panel.js"></script>
<script src="catalog-selection.js"></script>
<script src="forecast-domain.js"></script>
<script src="compare-mode.js?v=3.3-exp2"></script>
<script src="radar-analysis.js?v=3.3-exp9"></script>
<script src="typhoon-guidance.js?v=3.3-exp8"></script>
<script src="app.js?v=3.3-exp5"></script>

<!-- Google tag (gtag.js) -->

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-Q3DTERTT0J');
</script>

</body>
</html>
