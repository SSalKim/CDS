<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수치일기도표출시스템</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3Cpath d='M3 4h10v2H3zM3 7h7v2H3zM3 10h10v2H3z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3.4.14">
</head>
<body>
<div class="app-shell">
<aside class="sidebar">

<div class="logo-block" id="appTitleReset" role="button" tabindex="0">
<span class="title">수치일기도<br>표출시스템</span>
<div class="subtitle"><span>Chart Display</span> <span>System 3.4</span></div>
</div>

<nav class="main-menu" id="mainMenu">
<button class="menu-btn" data-menu="edit">편집일기도</button>
<button class="menu-btn" data-menu="analysis">분석장</button>
<button class="menu-btn active" data-menu="forecast">예보장</button>
<button class="menu-btn" data-menu="hazard">위험기상</button>
<button class="menu-btn" data-menu="ensemble">앙상블</button>
</nav>

<div class="model-box">
<div id="modelGrid" class="model-grid"></div>
</div>

</aside>

<main class="main-panel">

<div class="toolbar">

<div class="toolbar-left">

<div class="toolbar-time-row">

<button id="nowBtn">NOW</button>

<div class="main-datetime-group">
<input
id="runDate"
type="date"
min="1900-01-01"
max="2099-12-31"
>

<select id="runHour"></select>
</div>

<div class="time-toggle-stack">
<button id="kstBtn" class="time-mode active" type="button">KST</button>
<button id="utcBtn" class="time-mode" type="button">UTC</button>
</div>

<div id="runShiftGroup" class="run-shift-group" aria-label="자료시각 이동">
  <button type="button" data-shift-hours="-24">-24H</button>
  <button type="button" data-shift-hours="-12">-12H</button>
  <button type="button" data-shift-hours="-6">-6H</button>
  <button type="button" data-shift-hours="6">+6H</button>
  <button type="button" data-shift-hours="12">+12H</button>
  <button type="button" data-shift-hours="24">+24H</button>
</div>

</div>

<div class="toolbar-product-row">

<select id="productCategory"></select>
<select id="productSelect"></select>

<div id="timelineTopControls" class="timeline-top-controls"></div>

</div>

</div>

</div>

<div class="forecast-bar">
  <div class="forecast-shell">
    <input id="forecastSlider" class="native-forecast-slider" type="range" min="0" max="0" step="1" value="0">
    <div id="forecastTimeline" class="forecast-timeline" aria-label="forecast timeline"></div>
    <div id="forecastLabel" class="forecast-label-hidden">+000h</div>
  </div>
</div>

<div class="viewer-layout">

  <div class="viewer-wrap">

    <div id="modelStatus" class="viewer-message hidden"></div>

    <div id="chartImages" class="chart-images"></div>

    <div id="loadingOverlay" class="loading hidden">
      <div class="spinner"></div>
      <div class="loading-text">이미지 로딩 중</div>
    </div>

  </div>

  <aside id="auxSidebar" class="aux-sidebar hidden">
    <button id="mobileAuxTrigger" class="mobile-aux-trigger" type="button" aria-haspopup="dialog" aria-expanded="false">
      <span id="mobileAuxTitle" class="mobile-aux-title"></span>
      <strong id="mobileAuxValue" class="mobile-aux-value"></strong>
      <span class="mobile-aux-chevron" aria-hidden="true">&#9662;</span>
    </button>
    <button id="mobileAuxBackdrop" class="mobile-aux-backdrop" type="button" aria-label="보조 선택 닫기"></button>
    <div class="aux-sidebar-inner">
      <div class="aux-sidebar-title-row">
        <div id="auxSidebarTitle" class="aux-sidebar-title"></div>
        <button id="mobileAuxClose" class="mobile-aux-close" type="button" aria-label="보조 선택 닫기">&#10005;</button>
      </div>
      <input id="mobileAuxSearch" class="mobile-aux-search" type="search" placeholder="항목 검색" autocomplete="off">
      <div id="auxSidebarList" class="aux-sidebar-list"></div>
    </div>
  </aside>

</div>

</main>

</div>

<div id="selectionToast" class="selection-toast hidden" role="status" aria-live="polite"></div>

<script src="models.js?v=3.4.3"></script>
<script src="edit.js?v=3.4.2"></script>
<script src="analysis.js?v=3.4.2"></script>
<script src="products.js?v=3.4.2"></script>
<script src="hazards.js?v=3.4.2"></script>
<script src="ensemble.js?v=3.4.2"></script>

<script src="catalog-config.js?v=3.4.2"></script>
<script src="aux-data.js?v=3.4.2"></script>
<script src="aux-rules.js?v=3.4.3"></script>

<script src="cds-analytics.js?v=2"></script>
<script src="chart-utils.js?v=3.4.2"></script>
<script src="timeline-state.js?v=3.4.2"></script>
<script src="image-pipeline.js?v=3.4.2"></script>
<script src="time-controls.js?v=3.4.3"></script>
<script src="catalog-core.js?v=3.4.2"></script>
<script src="model-menu.js?v=3.4.3"></script>
<script src="product-menu.js?v=3.4.4"></script>
<script src="main-menu.js?v=3.4.2"></script>
<script src="aux-panel.js?v=3.4.3"></script>
<script src="catalog-selection.js?v=3.4.2"></script>
<script src="forecast-domain.js?v=3.4.2"></script>
<script src="compare-mode.js?v=3.4.6"></script>
<script src="radar-analysis.js?v=3.4.3"></script>
<script src="typhoon-guidance.js?v=3.4.19"></script>
<script src="app.js?v=3.4.8"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-Q3DTERTT0J');
</script>

</body>
</html>
