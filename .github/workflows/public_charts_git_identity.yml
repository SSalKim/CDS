name: Repair chart publisher Git identity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: [self-hosted, cds-vtg]
    timeout-minutes: 3
    steps:
      - name: Configure bot identity in chart checkout only
        shell: python3 {0}
        run: |
          from pathlib import Path
          import subprocess
          from urllib.parse import urlsplit
          root = Path.home() / "actions-runner-cds-public-charts/_work/CDS-Public-Charts/CDS-Public-Charts"
          if not (root / ".git").is_dir():
              raise SystemExit("Expected chart checkout is unavailable")
          def git(*args, check=True):
              return subprocess.run(["git", "-c", "safe.directory=" + str(root), *args], cwd=root,
                                    capture_output=True, text=True, check=check)
          remote = urlsplit(git("remote", "get-url", "origin").stdout.strip())
          if remote.hostname != "github.com" or remote.path.rstrip("/").removesuffix(".git").lower() != "/ssalkim/cds-public-charts":
              raise SystemExit("Unexpected chart repository; refusing configuration change")
          before = git("var", "GIT_COMMITTER_IDENT", check=False)
          print("Chart Git committer configured before repair:", before.returncode == 0)
          git("config", "--local", "user.name", "github-actions[bot]")
          git("config", "--local", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          git("var", "GIT_COMMITTER_IDENT")
          print("Chart Git committer configured after repair: True")
