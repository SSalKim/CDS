name: Backfill VTG images
run-name: Backfill VTG images ${{ github.event.inputs.start_from || github.run_number }}

on:
  workflow_dispatch:
    inputs:
      ranges:
        description: "UTC ranges, one per line: YYYYMMDDHH-YYYYMMDDHH"
        required: true
        type: string
        default: |
              2022040800-2022040800
              2022063000-2022063000
              2022070100-2022070100
              2022080906-2022080906
              2022081118-2022081118
              2022082812-2022082812
              2022090800-2022090800
              2022091200-2022091200
              2022091318-2022091318
              2022092300-2022092300
              2022092306-2022092306
              2022092600-2022092600
              2022092812-2022092812
              2022101406-2022101406
              2022101506-2022101506
              2022102700-2022102700
              2022111212-2022111212
              2022121112-2022121112
              2023042006-2023042006
              2023052006-2023052006
              2023060612-2023060612
              2023071506-2023071506
              2023072100-2023072100
              2023072718-2023072718
              2023080800-2023080800
              2023082400-2023082400
              2023082418-2023082418
              2023082800-2023082800
              2023083012-2023083012
              2023090512-2023090512
              2023092918-2023092918
              2023101706-2023101706
              2023121700-2023121700
              2023101712-2023101712
              2023101718-2023101718
              2023101800-2023101800
              2023082218-2023082218
              2023082300-2023082300
              2023082306-2023082306
              2023082312-2023082312
              2023082318-2023082318
              2023082400-2023082400
              2023082406-2023082406
              2023082412-2023082412
              2023082418-2023082418
              2023082500-2023082500
              2023082506-2023082506
              2023082512-2023082512
              2023082518-2023082518
              2023082606-2023082606
              2023082612-2023082612
              2022090206-2022090612
              2023080712-2023081100
      commit_every:
        description: "Deprecated. Backfill now commits once at the end of each input range/system."
        required: true
        default: "range"
      start_from:
        description: "Optional cycle to resume from, e.g. 2026041106"
        required: false
        default: ""
      diagnostics:
        description: "Print KMA APIHUB connectivity diagnostics"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: vtg-backfill
  cancel-in-progress: false

jobs:
  decide-runner:
    runs-on: ubuntu-latest
    outputs:
      runner_kind: ${{ steps.choose.outputs.runner_kind }}
      runner_labels: ${{ steps.choose.outputs.runner_labels }}
    steps:
      - name: Choose VTG runner
        id: choose
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN || github.token }}
        run: |
          set +e
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners"
          http_code="$(curl -sS \
            -o runners.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_url")"
          curl_status=$?

          if [ "$curl_status" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "Could not read self-hosted runner status (curl_status=${curl_status}, http_code=${http_code}); falling back to GitHub-hosted."
            echo "runner_kind=github-hosted" >> "$GITHUB_OUTPUT"
            echo 'runner_labels="ubuntu-latest"' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import json
          import os

          with open("runners.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          selected = None
          selected_has_cds_label = False
          for runner in payload.get("runners", []):
              labels = {str(label.get("name", "")).lower() for label in runner.get("labels", [])}
              name = str(runner.get("name", "")).lower()
              print(
                  "runner:",
                  runner.get("name"),
                  "status=",
                  runner.get("status"),
                  "busy=",
                  runner.get("busy"),
                  "labels=",
                  ",".join(sorted(labels)),
              )
              if (
                  runner.get("status") == "online"
                  and not runner.get("busy")
                  and ("cds-vtg" in labels or name == "cds-vtg-laptop")
              ):
                  selected = runner
                  selected_has_cds_label = "cds-vtg" in labels
                  break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              if selected:
                  print(f"Using self-hosted runner: {selected.get('name')}")
                  output.write("runner_kind=self-hosted\n")
                  if selected_has_cds_label:
                      output.write('runner_labels=["self-hosted","cds-vtg"]\n')
                  else:
                      print("Warning: selected runner is missing the cds-vtg label; using generic self-hosted routing.")
                      output.write('runner_labels=["self-hosted"]\n')
              else:
                  print("No idle cds-vtg self-hosted runner found; using GitHub-hosted.")
                  output.write("runner_kind=github-hosted\n")
                  output.write('runner_labels="ubuntu-latest"\n')
          PY

  backfill:
    needs: decide-runner
    runs-on: ${{ fromJson(needs.decide-runner.outputs.runner_labels) }}
    timeout-minutes: 720
    env:
      RUNNER_KIND: ${{ needs.decide-runner.outputs.runner_kind }}
      KMA_APIHUB_AUTH_KEY: ${{ secrets.KMA_APIHUB_AUTH_KEY }}
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      DIAGNOSTICS_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics || false }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        if: ${{ env.RUNNER_KIND != 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vtg.txt

      - name: Prepare self-hosted Python
        if: ${{ env.RUNNER_KIND == 'self-hosted' }}
        run: |
          cache_root="$HOME/.cache/cds-vtg"
          venv_path="$cache_root/venv"
          mkdir -p "$cache_root"
          if [ ! -x "$venv_path/bin/python" ]; then
            python3 -m venv "$venv_path"
            "$venv_path/bin/python" -m pip install --upgrade pip
          fi
          echo "$venv_path/bin" >> "$GITHUB_PATH"
          "$venv_path/bin/python" --version

      - name: Diagnose KMA APIHUB connectivity
        if: ${{ env.DIAGNOSTICS_INPUT == 'true' }}
        continue-on-error: true
        run: |
          set +e
          host="apihub-pub.kma.go.kr"
          year="$(date -u +%Y)"
          now_utc="$(date -u +%Y%m%d%H)00"

          echo "KMA APIHUB diagnostics at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Runner public IP:"
          curl -sS --connect-timeout 10 --max-time 15 https://api.ipify.org || true
          echo
          echo "DNS results for ${host}:"
          getent ahosts "$host" | awk '{print $1}' | sort -u || true

          probe() {
            local label="$1"
            local url="$2"
            echo "::group::${label}"
            for attempt in 1 2 3; do
              printf "attempt=%s " "$attempt"
              curl -sS -o /tmp/kma_probe_${label}_${attempt}.txt \
                --connect-timeout 20 \
                --max-time 40 \
                -w 'http_code=%{http_code} remote_ip=%{remote_ip} namelookup=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s starttransfer=%{time_starttransfer}s total=%{time_total}s error="%{errormsg}"\n' \
                "$url"
              sleep 2
            done
            echo "::endgroup::"
          }

          probe "td_lst" "https://${host}/api/typ01/url/td_lst.php?YY=${year}&disp=1&help=1&authKey=${KMA_APIHUB_AUTH_KEY}"
          probe "typ_lst" "https://${host}/api/typ01/url/typ_lst.php?YY=${year}&disp=1&help=1&authKey=${KMA_APIHUB_AUTH_KEY}"
          probe "typ_gts_now" "https://${host}/api/typ01/url/typ_gts_now.php?src=&tm=${now_utc}&mode=2&disp=1&help=0&authKey=${KMA_APIHUB_AUTH_KEY}"

      - name: Install system dependencies
        if: ${{ env.RUNNER_KIND != 'self-hosted' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgeos-dev libproj-dev proj-bin proj-data fonts-nanum
          fc-cache -f
          echo "Installed Korean fonts:"
          fc-list | grep -i "nanum" || true

      - name: Install Python dependencies
        run: |
          if [ "$RUNNER_KIND" = "self-hosted" ]; then
            cache_root="$HOME/.cache/cds-vtg"
            hash_file="$cache_root/requirements-vtg.sha256"
            req_hash="$(sha256sum requirements-vtg.txt | awk '{print $1}')"
            if [ -f "$hash_file" ] && [ "$(cat "$hash_file")" = "$req_hash" ]; then
              echo "Self-hosted Python requirements unchanged; skipping pip install."
              exit 0
            fi
            python -m pip install -r requirements-vtg.txt
            echo "$req_hash" > "$hash_file"
          else
            python -m pip install --upgrade pip
            python -m pip install -r requirements-vtg.txt
          fi

      - name: Generate cycle list
        shell: python
        run: |
          from datetime import datetime, timedelta
          from pathlib import Path
          import re

          ranges_text = """${{ inputs.ranges }}"""
          start_from = "${{ inputs.start_from }}".strip()

          pairs = re.findall(r"(\d{10})\s*-\s*(\d{10})", ranges_text)
          if not pairs:
              raise SystemExit("No valid ranges found. Use format like 2026011400-2026012012")

          records = []
          for range_index, (start, end) in enumerate(pairs, start=1):
              dt = datetime.strptime(start, "%Y%m%d%H")
              ed = datetime.strptime(end, "%Y%m%d%H")
              if ed < dt:
                  raise SystemExit(f"Invalid range: {start}-{end}")

              range_cycles = []
              while dt <= ed:
                  cycle = dt.strftime("%Y%m%d%H")
                  if not start_from or cycle >= start_from:
                      range_cycles.append(cycle)
                  dt += timedelta(hours=6)

              for idx, cycle in enumerate(range_cycles):
                  is_last = "1" if idx == len(range_cycles) - 1 else "0"
                  records.append((str(range_index), f"{start}-{end}", cycle, is_last))

          if not records:
              raise SystemExit("No cycles generated.")

          Path("vtg_backfill_cycles.tsv").write_text(
              "\n".join("\t".join(item) for item in records) + "\n",
              encoding="utf-8",
          )

          print(f"range_pairs={len(pairs)}")
          print(f"cycles={len(records)}")
          print(f"first={records[0][2]}")
          print(f"last={records[-1][2]}")

      - name: Run VTG backfill sequentially
        shell: bash
        run: |
          set -euo pipefail

          run_with_retry() {
            local attempt=1
            local max_attempts=2
            local delay_seconds=60
            until "$@"; do
              local status=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after $attempt attempt(s)."
                return "$status"
              fi
              echo "Command failed with exit code $status. Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          filter_changed_paths() {
            local input_file="$1"
            local output_file="$2"
            touch "$input_file"
            sort -u "$input_file" -o "$input_file"
            : > "$output_file"
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
                echo "$path" >> "$output_file"
              else
                echo "Skipping missing untracked changed path: $path"
              fi
            done < "$input_file"
            sort -u "$output_file" -o "$output_file"
          }

          commit_and_push() {
            local message="$1"
            local changed_file="$2"
            local filtered_file="$RUNNER_TEMP/vtg_changed_paths_filtered.txt"

            git diff --name-only -- VTG_IMG >> "$changed_file" || true
            git ls-files --others --exclude-standard -- VTG_IMG >> "$changed_file" || true
            filter_changed_paths "$changed_file" "$filtered_file"

            if [ -s "$filtered_file" ]; then
              git add --pathspec-from-file="$filtered_file" || true
            fi
            # Final safety net: include every actual VTG_IMG change once per range.
            git add -A VTG_IMG || true

            if git diff --cached --quiet; then
              echo "No VTG asset changes to commit for: $message"
              return 0
            fi

            git commit -m "$message"

            if [ -n "$(git status --porcelain -- VTG_IMG)" ]; then
              echo "Unexpected unstaged/untracked VTG_IMG changes before rebase:"
              git status --short -- VTG_IMG
              git add -A VTG_IMG
              git commit --amend --no-edit
            fi

            if [ -n "$(git status --porcelain -- VTG_IMG)" ]; then
              echo "Working tree is still dirty after amend; refusing to rebase."
              git status --short -- VTG_IMG
              exit 1
            fi

            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Rebase failed for: $message"
                git status --short
                git rebase --abort || true
                if [ "$attempt" -eq 3 ]; then
                  echo "Failed to rebase generated VTG assets after retries."
                  exit 1
                fi
                echo "Rebase failed; retrying ($attempt/3)."
                sleep $((attempt * 5))
                continue
              fi
              if git push origin HEAD:main; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to push generated VTG assets after retries."
                exit 1
              fi
              echo "Push failed after rebase; retrying ($attempt/3)."
              sleep $((attempt * 5))
            done
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CURRENT_RANGE_INDEX=""
          CURRENT_RANGE_LABEL=""
          RANGE_CHANGED_PATHS_FILE=""
          COUNT=0
          PARTIAL_COMMIT_ATTEMPTED=0

          partial_commit_on_exit() {
            local status="$1"
            trap - EXIT
            if [ "$status" -eq 0 ]; then
              return 0
            fi
            if [ "$PARTIAL_COMMIT_ATTEMPTED" = "1" ]; then
              exit "$status"
            fi
            PARTIAL_COMMIT_ATTEMPTED=1
            echo "Backfill interrupted or failed with exit code $status; attempting to preserve current VTG_IMG changes."

            local partial_changed_file
            if [ -n "${RANGE_CHANGED_PATHS_FILE:-}" ] && [ -f "$RANGE_CHANGED_PATHS_FILE" ]; then
              partial_changed_file="$RANGE_CHANGED_PATHS_FILE"
            else
              partial_changed_file="$RUNNER_TEMP/vtg_changed_paths_partial.txt"
              rm -f "$partial_changed_file"
              touch "$partial_changed_file"
            fi

            git diff --name-only -- VTG_IMG >> "$partial_changed_file" || true
            git ls-files --others --exclude-standard -- VTG_IMG >> "$partial_changed_file" || true
            sort -u "$partial_changed_file" -o "$partial_changed_file"

            if [ -s "$partial_changed_file" ] || [ -n "$(git status --porcelain -- VTG_IMG)" ]; then
              local label="${CURRENT_RANGE_LABEL:-interrupted}"
              if ! commit_and_push "Partial backfill VTG images $label" "$partial_changed_file"; then
                echo "Partial commit/push failed during exit cleanup."
              fi
            else
              echo "No VTG_IMG changes to preserve during exit cleanup."
            fi
            exit "$status"
          }

          trap 'partial_commit_on_exit $?' EXIT

          while IFS=$'\t' read -r RANGE_INDEX RANGE_LABEL CYCLE IS_LAST_IN_RANGE; do
            [ -z "$CYCLE" ] && continue

            if [ "$CURRENT_RANGE_INDEX" != "$RANGE_INDEX" ]; then
              CURRENT_RANGE_INDEX="$RANGE_INDEX"
              CURRENT_RANGE_LABEL="$RANGE_LABEL"
              RANGE_CHANGED_PATHS_FILE="$RUNNER_TEMP/vtg_changed_paths_range_${RANGE_INDEX}.txt"
              rm -f "$RANGE_CHANGED_PATHS_FILE"
              touch "$RANGE_CHANGED_PATHS_FILE"
              echo "::group::VTG range $RANGE_LABEL"
            fi

            echo "::group::VTG cycle $CYCLE"
            CYCLE_CHANGED_PATHS_FILE="$RUNNER_TEMP/vtg_changed_paths_${CYCLE}.txt"
            rm -f "$CYCLE_CHANGED_PATHS_FILE"

            run_with_retry python vtg_auto.py \
              --now "$CYCLE" \
              --force \
              --output-root VTG_IMG \
              --fcst-hours "120,240" \
              --no-auto-fcst-hours \
              --min-run-interval-minutes 0 \
              --http-cache-dir "$RUNNER_TEMP/vtg_http_cache" \
              --parallel-jobs 2 \
              --changed-paths-file "$CYCLE_CHANGED_PATHS_FILE"

            COUNT=$((COUNT + 1))
            touch "$CYCLE_CHANGED_PATHS_FILE"
            cat "$CYCLE_CHANGED_PATHS_FILE" >> "$RANGE_CHANGED_PATHS_FILE" || true
            git diff --name-only -- VTG_IMG >> "$RANGE_CHANGED_PATHS_FILE" || true
            git ls-files --others --exclude-standard -- VTG_IMG >> "$RANGE_CHANGED_PATHS_FILE" || true
            sort -u "$RANGE_CHANGED_PATHS_FILE" -o "$RANGE_CHANGED_PATHS_FILE"
            echo "::endgroup::"

            if [ "$IS_LAST_IN_RANGE" = "1" ]; then
              echo "Committing completed VTG range/system: $CURRENT_RANGE_LABEL"
              commit_and_push "Backfill VTG images $CURRENT_RANGE_LABEL" "$RANGE_CHANGED_PATHS_FILE"
              echo "::endgroup::"
              CURRENT_RANGE_INDEX=""
              CURRENT_RANGE_LABEL=""
              RANGE_CHANGED_PATHS_FILE=""
            fi
          done < vtg_backfill_cycles.tsv

          echo "::group::Rebuild split/full VTG manifest index"
          FINAL_CHANGED_PATHS_FILE="$RUNNER_TEMP/vtg_changed_paths_final.txt"
          rm -f "$FINAL_CHANGED_PATHS_FILE"
          python vtg_auto.py \
            --index-only \
            --output-root VTG_IMG \
            --changed-paths-file "$FINAL_CHANGED_PATHS_FILE"

          if [ -f "$FINAL_CHANGED_PATHS_FILE" ] && [ -s "$FINAL_CHANGED_PATHS_FILE" ]; then
            commit_and_push "Rebuild VTG manifest index" "$FINAL_CHANGED_PATHS_FILE"
          else
            git add VTG_IMG/manifest.json VTG_IMG/manifest || true
            if git diff --cached --quiet; then
              echo "No manifest index changes after backfill."
            else
              commit_and_push "Rebuild VTG manifest index" "$FINAL_CHANGED_PATHS_FILE"
            fi
          fi
          echo "::endgroup::"
