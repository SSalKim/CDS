name: Archive VTG images to Google Drive
run-name: Archive VTG ${{ inputs.storm_key || 'ended systems' }}

on:
  workflow_dispatch:
    inputs:
      storm_key:
        description: "Optional canonical system key; automatic runs always provide one"
        required: false
        type: string
      max_files:
        description: "Maximum new files to upload; 0 means no limit"
        required: false
        default: "500"
        type: string
      delete_local_after_upload:
        description: "Delete local PNGs after they are safely mapped in Drive manifest"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Only print archive candidates without uploading or deleting"
        required: false
        default: false
        type: boolean
      repair_permissions:
        description: "Ensure archived Drive files are publicly readable by link"
        required: false
        default: false
        type: boolean
      repair_only:
        description: "Repair permissions for existing archive files without uploading new images"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: vtg-drive-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      VTG_ARCHIVE_DRIVE_FOLDER_ID: ${{ secrets.VTG_ARCHIVE_DRIVE_FOLDER_ID }}
      MAX_FILES_INPUT: ${{ inputs.max_files }}
      DELETE_LOCAL_INPUT: ${{ inputs.delete_local_after_upload }}
      DRY_RUN_INPUT: ${{ inputs.dry_run }}
      REPAIR_PERMISSIONS_INPUT: ${{ inputs.repair_permissions }}
      REPAIR_ONLY_INPUT: ${{ inputs.repair_only }}
      STORM_KEY_INPUT: ${{ inputs.storm_key }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vtg-archive.txt

      - name: Install archive dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-vtg-archive.txt

      - name: Archive ended VTG images
        id: archive
        run: |
          set -euo pipefail

          changed_file="$RUNNER_TEMP/vtg_archive_changed_paths.txt"
          rm -f "$changed_file"
          archive_exit_code=0

          if [ "$DRY_RUN_INPUT" != "true" ]; then
            has_oauth="false"
            if [ -n "${GOOGLE_DRIVE_CLIENT_ID:-}" ] && [ -n "${GOOGLE_DRIVE_CLIENT_SECRET:-}" ] && [ -n "${GOOGLE_DRIVE_REFRESH_TOKEN:-}" ]; then
              has_oauth="true"
            fi
            if [ -z "${VTG_ARCHIVE_DRIVE_FOLDER_ID:-}" ]; then
              echo "VTG_ARCHIVE_DRIVE_FOLDER_ID secret is required."
              archive_exit_code=2
            fi
            if [ "$has_oauth" != "true" ] && [ -z "${GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON:-}" ]; then
              echo "Google Drive auth is required. For My Drive, set GOOGLE_DRIVE_CLIENT_ID, GOOGLE_DRIVE_CLIENT_SECRET, and GOOGLE_DRIVE_REFRESH_TOKEN."
              archive_exit_code=2
            fi
            if [ "$has_oauth" != "true" ]; then
              echo "OAuth refresh-token secrets are missing; falling back to service account auth. Service accounts need a shared drive, not a personal My Drive folder."
            fi
          fi

          args=(
            --output-root data
            --changed-paths-file "$changed_file"
            --max-files "${MAX_FILES_INPUT:-500}"
          )
          if [ "$DELETE_LOCAL_INPUT" = "true" ]; then
            args+=(--delete-local-after-upload)
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$REPAIR_PERMISSIONS_INPUT" = "true" ]; then
            args+=(--repair-permissions)
          fi
          if [ "$REPAIR_ONLY_INPUT" = "true" ]; then
            args+=(--repair-only)
          fi
          if [ -n "$STORM_KEY_INPUT" ]; then
            args+=(--storm-key "$STORM_KEY_INPUT")
          fi

          if [ "$archive_exit_code" = "0" ]; then
            set +e
            python vtg_drive_archive.py "${args[@]}"
            archive_exit_code=$?
            set -e
          fi
          echo "changed_paths_file=$changed_file" >> "$GITHUB_OUTPUT"
          echo "archive_exit_code=$archive_exit_code" >> "$GITHUB_OUTPUT"

      - name: Record automatic archive result
        if: ${{ env.DRY_RUN_INPUT != 'true' && env.STORM_KEY_INPUT != '' }}
        run: |
          set -euo pipefail
          changed_file="${{ steps.archive.outputs.changed_paths_file }}"
          archive_exit_code="${{ steps.archive.outputs.archive_exit_code }}"
          if [ "$archive_exit_code" = "0" ]; then
            python vtg_archive_state.py mark \
              --output-root data \
              --storm-key "$STORM_KEY_INPUT" \
              --state completed \
              --changed-paths-file "$changed_file"
          else
            python vtg_archive_state.py mark \
              --output-root data \
              --storm-key "$STORM_KEY_INPUT" \
              --state failed \
              --message "Archive workflow failed with exit code ${archive_exit_code}." \
              --changed-paths-file "$changed_file"
          fi

      - name: Commit archive changes
        if: ${{ env.DRY_RUN_INPUT != 'true' }}
        run: |
          set -euo pipefail

          changed_file="${{ steps.archive.outputs.changed_paths_file }}"
          if [ ! -s "$changed_file" ]; then
            echo "No VTG archive changes to commit."
            exit 0
          fi

          sort -u "$changed_file" -o "$changed_file"
          git add --pathspec-from-file="$changed_file" || true

          if git diff --cached --quiet; then
            echo "No staged VTG archive changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive VTG images to Google Drive"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase failed. Current git status:"
              git status --short
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to rebase VTG archive changes after retries."
                exit 1
              fi
              sleep $((attempt * 5))
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to push VTG archive changes after retries."
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Fail when archive command failed
        if: ${{ steps.archive.outputs.archive_exit_code != '0' }}
        run: |
          echo "VTG Drive archive failed with exit code ${{ steps.archive.outputs.archive_exit_code }}."
          exit 1
