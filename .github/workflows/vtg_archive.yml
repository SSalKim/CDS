name: Archive VTG images to Google Drive
run-name: Archive VTG images ${{ github.event.inputs.max_files || github.run_number }}

on:
  workflow_dispatch:
    inputs:
      max_files:
        description: "Maximum new files to upload; 0 means no limit"
        required: false
        default: "500"
        type: string
      delete_local_after_upload:
        description: "Delete local PNGs after they are safely mapped in Drive manifest"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Only print archive candidates without uploading or deleting"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: vtg-drive-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
      VTG_ARCHIVE_DRIVE_FOLDER_ID: ${{ secrets.VTG_ARCHIVE_DRIVE_FOLDER_ID }}
      MAX_FILES_INPUT: ${{ inputs.max_files }}
      DELETE_LOCAL_INPUT: ${{ inputs.delete_local_after_upload }}
      DRY_RUN_INPUT: ${{ inputs.dry_run }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vtg-archive.txt

      - name: Install archive dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-vtg-archive.txt

      - name: Archive ended VTG images
        id: archive
        run: |
          set -euo pipefail

          if [ "$DRY_RUN_INPUT" != "true" ]; then
            if [ -z "${GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON:-}" ] || [ -z "${VTG_ARCHIVE_DRIVE_FOLDER_ID:-}" ]; then
              echo "GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON and VTG_ARCHIVE_DRIVE_FOLDER_ID secrets are required."
              exit 1
            fi
          fi

          changed_file="$RUNNER_TEMP/vtg_archive_changed_paths.txt"
          rm -f "$changed_file"

          args=(
            --output-root VTG_IMG
            --archive-manifest-path VTG_IMG/drive_archive_manifest.json
            --changed-paths-file "$changed_file"
            --max-files "${MAX_FILES_INPUT:-500}"
          )
          if [ "$DELETE_LOCAL_INPUT" = "true" ]; then
            args+=(--delete-local-after-upload)
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            args+=(--dry-run)
          fi

          python vtg_drive_archive.py "${args[@]}"
          echo "changed_paths_file=$changed_file" >> "$GITHUB_OUTPUT"

      - name: Commit archive changes
        if: ${{ env.DRY_RUN_INPUT != 'true' }}
        run: |
          set -euo pipefail

          changed_file="${{ steps.archive.outputs.changed_paths_file }}"
          if [ ! -s "$changed_file" ]; then
            echo "No VTG archive changes to commit."
            exit 0
          fi

          sort -u "$changed_file" -o "$changed_file"
          git add --pathspec-from-file="$changed_file" || true

          if git diff --cached --quiet; then
            echo "No staged VTG archive changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive VTG images to Google Drive"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase failed. Current git status:"
              git status --short
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to rebase VTG archive changes after retries."
                exit 1
              fi
              sleep $((attempt * 5))
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to push VTG archive changes after retries."
              exit 1
            fi
            sleep $((attempt * 5))
          done
