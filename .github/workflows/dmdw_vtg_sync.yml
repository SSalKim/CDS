name: Sync DMDW VTG source data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      cycle:
        description: "Optional target cycle UTC, YYYYmmddHH. Default: latest DMDW KST collection window."
        required: false
        type: string
      storm_kind:
        description: "Manual storm kind when typ_seq is provided."
        required: false
        default: typ
        type: choice
        options:
          - typ
          - td
      typ_seq:
        description: "Optional manual DMDW storm number. Empty means auto-active."
        required: false
        type: string
      o_tm_seq:
        description: "Optional DMDW oTmSeq override."
        required: false
        type: string
      start_time:
        description: "Manual storm start UTC, YYYYmmddHHMM, used to derive oTmSeq when typ_seq is provided."
        required: false
        type: string
      max_models:
        description: "Optional debug limit for model requests."
        required: false
        type: string
      dry_run:
        description: "Print planned DMDW jobs without requesting or committing data."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: dmdw-vtg-sync
  cancel-in-progress: false

jobs:
  decide-runner:
    runs-on: ubuntu-latest
    outputs:
      runner_kind: ${{ steps.choose.outputs.runner_kind }}
      runner_labels: ${{ steps.choose.outputs.runner_labels }}
    steps:
      - name: Choose DMDW runner
        id: choose
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN || github.token }}
        run: |
          set +e
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners"
          max_wait_seconds=600
          poll_seconds=30
          elapsed=0

          while true; do
            http_code="$(curl -sS \
              -o runners.json \
              -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api_url")"
            curl_status=$?

            if [ "$curl_status" -ne 0 ] || [ "$http_code" != "200" ]; then
              echo "Could not read self-hosted runner status (curl_status=${curl_status}, http_code=${http_code}); falling back to GitHub-hosted."
              echo "runner_kind=github-hosted" >> "$GITHUB_OUTPUT"
              echo 'runner_labels="ubuntu-latest"' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            python - <<'PY' > runner_decision.json
          import json
          import sys

          with open("runners.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          selected = None
          selected_has_cds_label = False
          busy_matches = []
          for runner in payload.get("runners", []):
              labels = {str(label.get("name", "")).lower() for label in runner.get("labels", [])}
              name = str(runner.get("name", "")).lower()
              is_match = "cds-vtg" in labels or name == "cds-vtg-laptop"
              is_online = runner.get("status") == "online"
              is_busy = bool(runner.get("busy"))
              print(
                  "runner:",
                  runner.get("name"),
                  "status=",
                  runner.get("status"),
                  "busy=",
                  runner.get("busy"),
                  "labels=",
                  ",".join(sorted(labels)),
                  file=sys.stderr,
              )
              if not is_match or not is_online:
                  continue
              if is_busy:
                  busy_matches.append(str(runner.get("name", "self-hosted runner")))
                  continue
              selected = runner
              selected_has_cds_label = "cds-vtg" in labels
              break

          if selected:
              labels = '["self-hosted","cds-vtg"]' if selected_has_cds_label else '["self-hosted"]'
              result = {
                  "state": "idle",
                  "runner_labels": labels,
                  "message": f"Using idle self-hosted runner: {selected.get('name')}",
              }
          elif busy_matches:
              result = {
                  "state": "busy",
                  "runner_labels": '"ubuntu-latest"',
                  "message": "Matching self-hosted runner is busy (" + ", ".join(busy_matches) + ")",
              }
          else:
              result = {
                  "state": "unavailable",
                  "runner_labels": '"ubuntu-latest"',
                  "message": "No online cds-vtg self-hosted runner found.",
              }

          print(json.dumps(result))
          PY

            cat runner_decision.json
            state="$(python -c 'import json; print(json.load(open("runner_decision.json", encoding="utf-8"))["state"])')"
            runner_labels="$(python -c 'import json; print(json.load(open("runner_decision.json", encoding="utf-8"))["runner_labels"])')"
            message="$(python -c 'import json; print(json.load(open("runner_decision.json", encoding="utf-8"))["message"])')"

            if [ "$state" = "idle" ]; then
              echo "$message"
              echo "runner_kind=self-hosted" >> "$GITHUB_OUTPUT"
              echo "runner_labels=${runner_labels}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$state" = "busy" ] && [ "$elapsed" -lt "$max_wait_seconds" ]; then
              next_elapsed=$((elapsed + poll_seconds))
              if [ "$next_elapsed" -gt "$max_wait_seconds" ]; then
                sleep_seconds=$((max_wait_seconds - elapsed))
              else
                sleep_seconds="$poll_seconds"
              fi
              echo "${message}; waiting ${sleep_seconds}s before fallback check (${elapsed}/${max_wait_seconds}s elapsed)."
              sleep "$sleep_seconds"
              elapsed=$((elapsed + sleep_seconds))
              continue
            fi

            if [ "$state" = "busy" ]; then
              echo "${message}; exceeded ${max_wait_seconds}s wait, using GitHub-hosted."
            else
              echo "${message} Using GitHub-hosted."
            fi
            echo "runner_kind=github-hosted" >> "$GITHUB_OUTPUT"
            echo 'runner_labels="ubuntu-latest"' >> "$GITHUB_OUTPUT"
            exit 0
          done

  sync:
    needs: decide-runner
    runs-on: ${{ fromJson(needs.decide-runner.outputs.runner_labels) }}
    timeout-minutes: 20
    env:
      RUNNER_KIND: ${{ needs.decide-runner.outputs.runner_kind }}
      DMDW_ID: ${{ secrets.DMDW_ID }}
      DMDW_PW: ${{ secrets.DMDW_PW }}
      DMDW_COOKIE: ${{ secrets.DMDW_COOKIE }}
      DMDW_CSRF: ${{ secrets.DMDW_CSRF }}
      DMDW_BROWSER_EXECUTABLE: ${{ vars.DMDW_BROWSER_EXECUTABLE || secrets.DMDW_BROWSER_EXECUTABLE }}
      DMDW_ALLOW_COOKIE_FALLBACK: ${{ vars.DMDW_ALLOW_COOKIE_FALLBACK || 'false' }}
      KMA_APIHUB_AUTH_KEY: ${{ secrets.KMA_APIHUB_AUTH_KEY }}
      CYCLE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.cycle || '' }}
      STORM_KIND_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.storm_kind || 'typ' }}
      TYP_SEQ_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.typ_seq || '' }}
      O_TM_SEQ_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.o_tm_seq || '' }}
      START_TIME_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.start_time || '' }}
      MAX_MODELS_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.max_models || '' }}
      DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        if: ${{ env.RUNNER_KIND != 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dmdw.txt

      - name: Prepare self-hosted Python
        if: ${{ env.RUNNER_KIND == 'self-hosted' }}
        run: |
          cache_root="$HOME/.cache/cds-vtg"
          venv_path="$cache_root/dmdw-venv"
          mkdir -p "$cache_root"
          if [ ! -x "$venv_path/bin/python" ]; then
            python3 -m venv "$venv_path"
            "$venv_path/bin/python" -m pip install --upgrade pip
          fi
          echo "$venv_path/bin" >> "$GITHUB_PATH"
          "$venv_path/bin/python" --version

      - name: Check DMDW credentials
        id: dmdw_credentials
        run: |
          set -euo pipefail
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            echo "can_sync=true" >> "$GITHUB_OUTPUT"
            echo "Dry run requested; DMDW credentials are not required."
            exit 0
          fi

          if [ -n "$DMDW_ID" ] && [ -n "$DMDW_PW" ]; then
            echo "can_sync=true" >> "$GITHUB_OUTPUT"
            echo "auth_mode=login" >> "$GITHUB_OUTPUT"
            echo "DMDW_ID/DMDW_PW are configured; a fresh cookie will be generated."
            exit 0
          fi

          if [ -n "$DMDW_COOKIE" ]; then
            echo "can_sync=true" >> "$GITHUB_OUTPUT"
            echo "auth_mode=cookie" >> "$GITHUB_OUTPUT"
            echo "DMDW_COOKIE is configured."
            exit 0
          fi

          echo "can_sync=false" >> "$GITHUB_OUTPUT"
          echo "auth_mode=none" >> "$GITHUB_OUTPUT"
          echo "::notice::DMDW credentials are not configured. Skipping DMDW sync."

      - name: Install DMDW dependencies
        if: ${{ steps.dmdw_credentials.outputs.can_sync == 'true' && env.DRY_RUN_INPUT != 'true' }}
        env:
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
        run: |
          set -euo pipefail
          echo "Using PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=${PLAYWRIGHT_HOST_PLATFORM_OVERRIDE}"
          echo "PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=${PLAYWRIGHT_HOST_PLATFORM_OVERRIDE}" >> "$GITHUB_ENV"

          if [ "$RUNNER_KIND" = "self-hosted" ]; then
            cache_root="$HOME/.cache/cds-vtg"
            venv_path="$cache_root/dmdw-venv"
            hash_file="$venv_path/requirements-dmdw.sha256"
            req_hash="$(sha256sum requirements-dmdw.txt | awk '{print $1}')"

            if [ -f "$hash_file" ] && [ "$(cat "$hash_file")" = "$req_hash" ]; then
              echo "Self-hosted DMDW requirements unchanged; skipping pip install."
            else
              python -m pip install -r requirements-dmdw.txt
              echo "$req_hash" > "$hash_file"
            fi

            if [ "${{ steps.dmdw_credentials.outputs.auth_mode }}" = "login" ]; then
              browser_path="${DMDW_BROWSER_EXECUTABLE:-}"

              find_system_browser() {
                for browser_cmd in google-chrome-stable google-chrome chromium-browser chromium microsoft-edge microsoft-edge-stable; do
                  if command -v "$browser_cmd" >/dev/null 2>&1; then
                    command -v "$browser_cmd"
                    return 0
                  fi
                done
                for browser_file in \
                  /usr/bin/google-chrome-stable \
                  /usr/bin/google-chrome \
                  /usr/bin/chromium-browser \
                  /usr/bin/chromium \
                  /snap/bin/chromium \
                  /opt/google/chrome/chrome \
                  /opt/microsoft/msedge/msedge; do
                  if [ -x "$browser_file" ]; then
                    printf '%s\n' "$browser_file"
                    return 0
                  fi
                done
                return 1
              }

              if [ -n "$browser_path" ] && [ ! -x "$browser_path" ]; then
                echo "::warning::DMDW_BROWSER_EXECUTABLE is set but not executable: $browser_path"
                browser_path=""
                echo "DMDW_BROWSER_EXECUTABLE=" >> "$GITHUB_ENV"
              fi

              if [ -z "$browser_path" ]; then
                browser_path="$(find_system_browser || true)"
              fi

              if [ -n "$browser_path" ]; then
                echo "DMDW_BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
                echo "Using system browser for DMDW login: $browser_path"
              else
                echo "No system Chrome/Chromium found; installing Playwright-managed Chromium."
                python -m playwright install chromium
                echo "Using Playwright-managed Chromium for DMDW login."
              fi

              if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
                echo "Installing/checking Playwright Chromium Linux dependencies."
                python -m playwright install-deps chromium || \
                  echo "::warning::playwright install-deps chromium failed; browser launch may still fail if host libraries are missing."
              else
                echo "::warning::passwordless sudo is unavailable; cannot run playwright install-deps chromium."
                echo "::warning::If browser launch fails with libnspr4/libnss3/GTK errors, install Chromium dependencies on the runner host."
              fi
            fi
          else
            python -m pip install --upgrade pip
            python -m pip install -r requirements-dmdw.txt
            if [ "${{ steps.dmdw_credentials.outputs.auth_mode }}" = "login" ]; then
              python -m playwright install --with-deps chromium
            fi
          fi

      - name: Diagnose DMDW connectivity
        if: ${{ steps.dmdw_credentials.outputs.can_sync == 'true' && env.DRY_RUN_INPUT != 'true' }}
        continue-on-error: true
        run: |
          set +e
          echo "Runner public IP:"
          curl -sS --connect-timeout 10 --max-time 15 https://api.ipify.org || true
          echo
          echo "DMDW DNS results:"
          getent ahosts dmdw.kma.go.kr | awk '{print $1}' | sort -u || true
          echo "DMDW home probe:"
          curl -sS -o /tmp/dmdw_home_probe.html \
            --connect-timeout 20 \
            --max-time 60 \
            -w 'http_code=%{http_code} remote_ip=%{remote_ip} namelookup=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s starttransfer=%{time_starttransfer}s total=%{time_total}s error="%{errormsg}"\n' \
            https://dmdw.kma.go.kr/ || true
          wc -c /tmp/dmdw_home_probe.html || true

      - name: Prepare DMDW session
        if: ${{ steps.dmdw_credentials.outputs.can_sync == 'true' && env.DRY_RUN_INPUT != 'true' }}
        run: |
          set -euo pipefail
          session_dir="$RUNNER_TEMP/dmdw_session"
          mkdir -p "$session_dir"
          if [ "${{ steps.dmdw_credentials.outputs.auth_mode }}" = "login" ]; then
            login_status=1
            login_args=(
              --output-dir "$session_dir"
              --headless
            )
            if [ -n "${DMDW_BROWSER_EXECUTABLE:-}" ]; then
              login_args+=(--browser-executable "$DMDW_BROWSER_EXECUTABLE")
            fi

            if python DMDW_VTG/auto_login_refresh_cookie.py "${login_args[@]}"; then
              login_status=0
            else
              login_status=$?
            fi

            if [ "$login_status" -eq 0 ]; then
              echo "DMDW fresh login succeeded."
            elif [ -n "$DMDW_COOKIE" ] && [ "${DMDW_ALLOW_COOKIE_FALLBACK:-false}" = "true" ]; then
              echo "::warning::DMDW fresh login failed; falling back to DMDW_COOKIE secret because DMDW_ALLOW_COOKIE_FALLBACK=true."
              printf '%s' "$DMDW_COOKIE" > "$session_dir/cookie.txt"
              if [ -n "$DMDW_CSRF" ]; then
                printf '%s' "$DMDW_CSRF" > "$session_dir/csrf.txt"
              fi
            else
              echo "::error::DMDW fresh login failed. Not falling back to stale DMDW_COOKIE."
              echo "::error::Fix browser dependencies/login first, or set repository variable DMDW_ALLOW_COOKIE_FALLBACK=true to allow fallback."
              exit "$login_status"
            fi
          else
            printf '%s' "$DMDW_COOKIE" > "$session_dir/cookie.txt"
            if [ -n "$DMDW_CSRF" ]; then
              printf '%s' "$DMDW_CSRF" > "$session_dir/csrf.txt"
            fi
            echo "Using DMDW_COOKIE secret for this sync."
          fi

      - name: Sync DMDW VTG source data
        if: ${{ steps.dmdw_credentials.outputs.can_sync == 'true' }}
        run: |
          set -euo pipefail
          changed_paths="$RUNNER_TEMP/dmdw_changed_paths.txt"
          rm -f "$changed_paths"
          touch "$changed_paths"

          args=(
            --cycle "${CYCLE_INPUT:-latest}"
            --output-root data/dmdw
            --changed-paths-file "$changed_paths"
          )

          if [ -n "$MAX_MODELS_INPUT" ]; then
            args+=(--max-models "$MAX_MODELS_INPUT")
          fi
          if [ -n "$O_TM_SEQ_INPUT" ]; then
            args+=(--o-tm-seq "$O_TM_SEQ_INPUT")
          fi
          if [ -n "$START_TIME_INPUT" ]; then
            args+=(--start-time "$START_TIME_INPUT")
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            args+=(--dry-run)
          fi

          if [ -n "$TYP_SEQ_INPUT" ]; then
            year="${CYCLE_INPUT:0:4}"
            if ! [[ "$year" =~ ^[0-9]{4}$ ]]; then
              year="$(date -u +%Y)"
            fi
            args+=(--year "$year" --typ-seq "$TYP_SEQ_INPUT" --storm-kind "$STORM_KIND_INPUT")
          else
            args+=(--auto-active)
          fi

          if [ "$DRY_RUN_INPUT" != "true" ]; then
            args+=(--cookie-file "$RUNNER_TEMP/dmdw_session/cookie.txt")
            args+=(--csrf-file "$RUNNER_TEMP/dmdw_session/csrf.txt")
          fi

          python DMDW_VTG/query_models.py "${args[@]}"

      - name: Validate DMDW source data
        if: ${{ steps.dmdw_credentials.outputs.can_sync == 'true' && env.DRY_RUN_INPUT != 'true' }}
        run: |
          python DMDW_VTG/validate_dmdw_outputs.py --root data/dmdw

      - name: Commit DMDW source data
        if: ${{ steps.dmdw_credentials.outputs.can_sync == 'true' && env.DRY_RUN_INPUT != 'true' }}
        run: |
          set -euo pipefail
          changed_paths="$RUNNER_TEMP/dmdw_changed_paths.txt"
          if [ ! -s "$changed_paths" ]; then
            echo "No DMDW source data changes to commit."
            exit 0
          fi

          sort -u "$changed_paths" -o "$changed_paths"
          git add --pathspec-from-file="$changed_paths"

          if git diff --cached --quiet; then
            echo "No staged DMDW source data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update DMDW VTG source data"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git status --short
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 5))
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
