name: Generate VTG images

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "Optional UTC override, YYYYmmddHHMM"
        required: false
        type: string
      force:
        description: "Run again even when the previous image already reached the model target"
        required: false
        default: true
        type: boolean
      manual_args:
        description: "Optional raw VTG.py args for one manual image run"
        required: false
        type: string
      dry_run:
        description: "Print the planned VTG runs without writing output files"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: vtg-image-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KMA_APIHUB_AUTH_KEY: ${{ secrets.KMA_APIHUB_AUTH_KEY }}
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      NOW_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.now || '' }}
      FORCE_INPUT: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force) }}
      MANUAL_VTG_ARGS: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_args || '' }}
      DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vtg.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum libgeos-dev libproj-dev proj-bin proj-data

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-vtg.txt

      - name: Run VTG automation
        run: |
          args=()
          if [ -n "$NOW_INPUT" ]; then
            args+=(--now "$NOW_INPUT")
          fi
          if [ "$FORCE_INPUT" = "true" ]; then
            args+=(--force)
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$MANUAL_VTG_ARGS" ]; then
            if [ "$DRY_RUN_INPUT" = "true" ]; then
              echo "Manual VTG args: $MANUAL_VTG_ARGS"
            else
              python vtg_manual_run.py --vtg-args "$MANUAL_VTG_ARGS"
            fi
          else
            python vtg_auto.py "${args[@]}"
          fi

      - name: Commit generated VTG assets
        if: ${{ env.DRY_RUN_INPUT != 'true' }}
        run: |
          if [ -z "$(git status --porcelain -- VTG_IMG)" ]; then
            echo "No VTG asset changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VTG_IMG
          git commit -m "Update VTG images"
          git push
