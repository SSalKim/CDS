name: Generate VTG images
run-name: Generate VTG images ${{ github.event.inputs.now || github.run_number }}

on:
  workflow_dispatch:
    inputs:
      now:
        description: "Optional target cycle UTC, YYYYmmddHH (00/06/12/18)"
        required: false
        type: string
      force:
        description: "Run again even when the previous image already reached the model target"
        required: false
        default: false
        type: boolean
      manual_args:
        description: "Optional raw VTG.py args for one manual image run"
        required: false
        type: string
      dry_run:
        description: "Print the planned VTG runs without writing output files"
        required: false
        default: false
        type: boolean
      diagnostics:
        description: "Print KMA APIHUB connectivity diagnostics"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: vtg-image-generation
  cancel-in-progress: false

jobs:
  decide-runner:
    runs-on: ubuntu-latest
    outputs:
      runner_kind: ${{ steps.choose.outputs.runner_kind }}
      runner_labels: ${{ steps.choose.outputs.runner_labels }}
    steps:
      - name: Choose VTG runner
        id: choose
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN || github.token }}
        run: |
          set +e
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners"
          http_code="$(curl -sS \
            -o runners.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_url")"
          curl_status=$?

          if [ "$curl_status" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "Could not read self-hosted runner status (curl_status=${curl_status}, http_code=${http_code}); falling back to GitHub-hosted."
            echo "runner_kind=github-hosted" >> "$GITHUB_OUTPUT"
            echo 'runner_labels="ubuntu-latest"' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import json
          import os

          with open("runners.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          selected = None
          selected_has_cds_label = False
          busy_matches = []
          for runner in payload.get("runners", []):
              labels = {str(label.get("name", "")).lower() for label in runner.get("labels", [])}
              name = str(runner.get("name", "")).lower()
              is_match = "cds-vtg" in labels or name == "cds-vtg-laptop"
              is_online = runner.get("status") == "online"
              is_busy = bool(runner.get("busy"))
              print(
                  "runner:",
                  runner.get("name"),
                  "status=",
                  runner.get("status"),
                  "busy=",
                  runner.get("busy"),
                  "labels=",
                  ",".join(sorted(labels)),
              )

              # Generate VTG images should use the laptop only when it is both
              # online and idle. If the matching laptop is busy, run immediately
              # on GitHub-hosted instead of waiting in the self-hosted queue.
              if is_match and is_online and is_busy:
                  busy_matches.append(str(runner.get("name", "self-hosted runner")))
                  continue
              if is_match and is_online and not is_busy:
                  selected = runner
                  selected_has_cds_label = "cds-vtg" in labels
                  break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              if selected:
                  print(f"Using idle self-hosted runner: {selected.get('name')}")
                  output.write("runner_kind=self-hosted\n")
                  if selected_has_cds_label:
                      output.write('runner_labels=["self-hosted","cds-vtg"]\n')
                  else:
                      print("Warning: selected runner is missing the cds-vtg label; using generic self-hosted routing.")
                      output.write('runner_labels=["self-hosted"]\n')
              else:
                  if busy_matches:
                      print(
                          "Matching self-hosted runner is busy ("
                          + ", ".join(busy_matches)
                          + "); using GitHub-hosted instead."
                      )
                  else:
                      print("No online idle cds-vtg self-hosted runner found; using GitHub-hosted.")
                  output.write("runner_kind=github-hosted\n")
                  output.write('runner_labels="ubuntu-latest"\n')
          PY

  generate:
    needs: decide-runner
    runs-on: ${{ fromJson(needs.decide-runner.outputs.runner_labels) }}
    timeout-minutes: 30
    env:
      RUNNER_KIND: ${{ needs.decide-runner.outputs.runner_kind }}
      KMA_APIHUB_AUTH_KEY: ${{ secrets.KMA_APIHUB_AUTH_KEY }}
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      NOW_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.now || '' }}
      FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      MANUAL_VTG_ARGS: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_args || '' }}
      DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      DIAGNOSTICS_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics || false }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        if: ${{ env.RUNNER_KIND != 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vtg.txt

      - name: Restore Cartopy map cache
        if: ${{ env.RUNNER_KIND != 'self-hosted' }}
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-natural-earth-50m-v1

      - name: Prepare self-hosted Python
        if: ${{ env.RUNNER_KIND == 'self-hosted' }}
        run: |
          cache_root="$HOME/.cache/cds-vtg"
          venv_path="$cache_root/venv"
          mkdir -p "$cache_root"
          if [ ! -x "$venv_path/bin/python" ]; then
            python3 -m venv "$venv_path"
            "$venv_path/bin/python" -m pip install --upgrade pip
          fi
          echo "$venv_path/bin" >> "$GITHUB_PATH"
          "$venv_path/bin/python" --version

      - name: Diagnose KMA APIHUB connectivity
        if: ${{ env.DIAGNOSTICS_INPUT == 'true' }}
        continue-on-error: true
        run: |
          set +e
          host="apihub-pub.kma.go.kr"
          year="$(date -u +%Y)"
          now_utc="$(date -u +%Y%m%d%H)00"

          echo "KMA APIHUB diagnostics at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Runner public IP:"
          curl -sS --connect-timeout 10 --max-time 15 https://api.ipify.org || true
          echo
          echo "DNS results for ${host}:"
          getent ahosts "$host" | awk '{print $1}' | sort -u || true

          probe() {
            local label="$1"
            local url="$2"
            echo "::group::${label}"
            for attempt in 1 2 3; do
              printf "attempt=%s " "$attempt"
              curl -sS -o /tmp/kma_probe_${label}_${attempt}.txt \
                --connect-timeout 20 \
                --max-time 40 \
                -w 'http_code=%{http_code} remote_ip=%{remote_ip} namelookup=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s starttransfer=%{time_starttransfer}s total=%{time_total}s error="%{errormsg}"\n' \
                "$url"
              sleep 2
            done
            echo "::endgroup::"
          }

          probe "td_lst" "https://${host}/api/typ01/url/td_lst.php?YY=${year}&disp=1&help=1&authKey=${KMA_APIHUB_AUTH_KEY}"
          probe "typ_lst" "https://${host}/api/typ01/url/typ_lst.php?YY=${year}&disp=1&help=1&authKey=${KMA_APIHUB_AUTH_KEY}"
          probe "typ_gts_now" "https://${host}/api/typ01/url/typ_gts_now.php?src=&tm=${now_utc}&mode=2&disp=1&help=0&authKey=${KMA_APIHUB_AUTH_KEY}"

      - name: Precheck VTG run
        id: vtg_precheck
        run: |
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            echo "deps_needed=false" >> "$GITHUB_OUTPUT"
            echo "run_step_needed=true" >> "$GITHUB_OUTPUT"
            echo "Dry run requested; dependency install is not needed."
            exit 0
          fi

          if [ -n "$MANUAL_VTG_ARGS" ] || [ "$FORCE_INPUT" = "true" ]; then
            echo "deps_needed=true" >> "$GITHUB_OUTPUT"
            echo "run_step_needed=true" >> "$GITHUB_OUTPUT"
            echo "Manual or forced run requested; running the full VTG job."
            exit 0
          fi

          args=(--fcst-hours "120,240" --no-auto-fcst-hours --min-run-interval-minutes 8 --check-run-needed --github-output "$GITHUB_OUTPUT")
          if [ -n "$NOW_INPUT" ]; then
            args+=(--now "$NOW_INPUT")
          fi

          if ! python vtg_auto.py "${args[@]}"; then
            echo "Precheck failed; falling back to the full VTG job."
            echo "deps_needed=true" >> "$GITHUB_OUTPUT"
            echo "run_step_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python dependencies
        if: ${{ steps.vtg_precheck.outputs.deps_needed == 'true' }}
        run: |
          if [ "$RUNNER_KIND" = "self-hosted" ]; then
            cache_root="$HOME/.cache/cds-vtg"
            hash_file="$cache_root/requirements-vtg.sha256"
            req_hash="$(sha256sum requirements-vtg.txt | awk '{print $1}')"
            if [ -f "$hash_file" ] && [ "$(cat "$hash_file")" = "$req_hash" ]; then
              echo "Self-hosted Python requirements unchanged; skipping pip install."
              exit 0
            fi
            python -m pip install --only-binary=:all: -r requirements-vtg.txt
            echo "$req_hash" > "$hash_file"
          else
            python -m pip install --only-binary=:all: -r requirements-vtg.txt
          fi

      - name: Run VTG automation
        if: ${{ steps.vtg_precheck.outputs.run_step_needed == 'true' }}
        run: |
          run_with_retry() {
            local attempt=1
            local max_attempts=2
            local delay_seconds=60
            until "$@"; do
              local status=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after $attempt attempt(s)."
                return "$status"
              fi
              echo "Command failed with exit code $status. Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          args=()
          if [ -n "$NOW_INPUT" ]; then
            args+=(--now "$NOW_INPUT")
          fi
          if [ "$FORCE_INPUT" = "true" ]; then
            args+=(--force)
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$MANUAL_VTG_ARGS" ]; then
            if [ "$DRY_RUN_INPUT" = "true" ]; then
              echo "Manual VTG args: $MANUAL_VTG_ARGS"
            else
              run_with_retry python vtg_manual_run.py --vtg-args "$MANUAL_VTG_ARGS"
            fi
          else
            CHANGED_PATHS_FILE="$RUNNER_TEMP/vtg_changed_paths.txt"
            rm -f "$CHANGED_PATHS_FILE"
            args+=(--fcst-hours "120,240" --no-auto-fcst-hours --min-run-interval-minutes 8 --changed-paths-file "$CHANGED_PATHS_FILE" --http-cache-dir "$RUNNER_TEMP/vtg_http_cache" --parallel-jobs 2)
            run_with_retry python vtg_auto.py "${args[@]}"
          fi

      - name: Commit generated VTG assets
        if: ${{ env.DRY_RUN_INPUT != 'true' }}
        run: |
          set -euo pipefail

          commit_and_push() {
            local message="$1"
            if git diff --cached --quiet; then
              echo "No VTG asset changes to commit."
              return 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "$message"

            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Rebase failed. Current git status:"
                git status --short
                git rebase --abort || true
                if [ "$attempt" -eq 3 ]; then
                  echo "Failed to rebase generated VTG assets after retries."
                  exit 1
                fi
                echo "Rebase failed; retrying ($attempt/3)."
                sleep $((attempt * 5))
                continue
              fi
              if git push origin HEAD:main; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to push generated VTG assets after retries."
                exit 1
              fi
              echo "Push failed after rebase; retrying ($attempt/3)."
              sleep $((attempt * 5))
            done
          }

          CHANGED_PATHS_FILE="$RUNNER_TEMP/vtg_changed_paths.txt"
          FILTERED_PATHS_FILE="$RUNNER_TEMP/vtg_changed_paths_existing.txt"
          touch "$CHANGED_PATHS_FILE"
          if [ -n "$MANUAL_VTG_ARGS" ]; then
            echo "Manual VTG run: discovering generated paths from git status."
            git diff --name-only -- data VTG_IMG >> "$CHANGED_PATHS_FILE" || true
            git ls-files --others --exclude-standard -- data >> "$CHANGED_PATHS_FILE" || true
          else
            echo "Automatic VTG run: using the exact changed-path list from vtg_auto.py."
          fi
          sort -u "$CHANGED_PATHS_FILE" -o "$CHANGED_PATHS_FILE"

          : > "$FILTERED_PATHS_FILE"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "$path" >> "$FILTERED_PATHS_FILE"
            else
              echo "Skipping missing untracked changed path: $path"
            fi
          done < "$CHANGED_PATHS_FILE"
          sort -u "$FILTERED_PATHS_FILE" -o "$FILTERED_PATHS_FILE"

          if [ -s "$FILTERED_PATHS_FILE" ]; then
            git add --pathspec-from-file="$FILTERED_PATHS_FILE" || true
          else
            echo "Changed-path list is empty or all paths are missing."
          fi
          commit_and_push "Update VTG images"
